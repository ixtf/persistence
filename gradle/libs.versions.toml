[versions]
conVersion = "1.0.0"
arcadeVersion = "26.10.2"

[libraries]
arcadedb-engine = { module = "com.arcadedb:arcadedb-engine", version.ref = "arcadeVersion" }
arcadedb-studio = { module = "com.arcadedb:arcadedb-studio", version.ref = "arcadeVersion" }
arcadedb-graphql = { module = "com.arcadedb:arcadedb-graphql", version.ref = "arcadeVersion" }
arcadedb-server = { module = "com.arcadedb:arcadedb-server", version.ref = "arcadeVersion" }
arcadedb-ha-raft = { module = "com.arcadedb:arcadedb-ha-raft", version.ref = "arcadeVersion" }

[plugins]
convention-spotless = { id = "io.github.ixtf.gradle.convention-spotless", version.ref = "conVersion" }
convention-kotlin-jvm = { id = "io.github.ixtf.gradle.convention-kotlin-jvm", version.ref = "conVersion" }
convention-maven-publish = { id = "io.github.ixtf.gradle.convention-maven-publish", version.ref = "conVersion" }
convention-ksp = { id = "io.github.ixtf.gradle.convention-ksp", version.ref = "conVersion" }
